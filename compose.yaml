# Local run: PostgreSQL 18, migrations, the service. Dev mode: identities are not
# verified (AUTH_MODE=insecure-dev), reflection is on, logs are text.
#   docker compose up --build
#   grpcurl -plaintext -H 'x-service-authorization: Bearer dev:bank-bff' \
#     -H 'authorization: Bearer dev:<user_id>' localhost:9090 list
name: bank-statement-data

x-env: &env
  SERVICE_NAME: bank-statement-data
  ENV: dev
  AUTH_MODE: insecure-dev
  LOG_FORMAT: text
  LOG_LEVEL: debug
  DB_PRIMARY_DSN: postgres://bank_statement_data:bank_statement_data@postgres:5432/bank_statement_data?sslmode=disable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bank_statement_data
      POSTGRES_PASSWORD: bank_statement_data
      POSTGRES_DB: bank_statement_data
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bank_statement_data", "-d", "bank_statement_data"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate", "up"]
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }

  bank-statement-data:
    build: .
    command: ["serve"]
    environment:
      <<: *env
      TBANK_LOGIN_URL: ${TBANK_LOGIN_URL:?Set TBANK_LOGIN_URL}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-https://storage.yandexcloud.net}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set the dedicated private bucket}
      OBJECT_STORAGE_KMS_KEY_ID: ${OBJECT_STORAGE_KMS_KEY_ID:?Set the KMS key ID}
      OBJECT_STORAGE_IAM_TOKEN_FILE: /run/secrets/object-storage-iam
    volumes:
      - type: bind
        source: ${OBJECT_STORAGE_IAM_TOKEN_FILE:?Set an externally rotated IAM token file}
        target: /run/secrets/object-storage-iam
        read_only: true
    ports: ["127.0.0.1:9090:9090", "127.0.0.1:9091:9091"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
